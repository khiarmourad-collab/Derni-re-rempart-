<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dernier Rempart</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
:root{font-family:Inter,system-ui,sans-serif;color:#f8e7c4;background:#10151b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#72523670,transparent 58%),linear-gradient(180deg,#202831,#0d1118 85%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:repeating-linear-gradient(0deg,transparent 0 37px,#ffffff0b 38px),repeating-linear-gradient(90deg,transparent 0 52px,#ffffff08 53px)}main{max-width:1000px;margin:auto;padding:16px;position:relative}h1,h2{font-family:Cinzel,Georgia,serif}h1{font-size:clamp(27px,6vw,54px);letter-spacing:.085em;text-align:center;color:#ffdf99;text-shadow:0 3px 0 #4c2c1e,0 0 28px #e1a34e60;margin:17px 0 3px}h2{font-size:1.08rem;letter-spacing:.045em;margin:3px 0 14px;color:#eacb8b}.sub{text-align:center;color:#c8ac84;letter-spacing:.09em;font-size:12px;text-transform:uppercase}.panel{background:linear-gradient(155deg,#30363cfa,#1b252ef7);border:1px solid #806b4d;border-radius:15px;padding:19px;margin:15px 0;box-shadow:0 8px 24px #0006,inset 0 1px #ffffff1b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;padding:14px 5px 17px;background:linear-gradient(#69768133,#1d2934aa);border-radius:11px;border-bottom:7px solid #504d43;position:relative}.grid:after{content:"";position:absolute;left:0;right:0;bottom:-15px;height:10px;background:repeating-linear-gradient(90deg,#766c5d 0 27px,#4a453d 27px 30px);border-radius:2px}.cell{min-width:0;height:116px;background:linear-gradient(145deg,#7c8285,#4d5961);color:#fff3d9;border:2px solid #b8a88d;border-bottom:7px solid #42484a;border-radius:5px 5px 3px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:800;cursor:pointer;padding:2px;box-shadow:inset 0 2px #ffffff38,0 3px 6px #0006;transition:transform .12s,filter .12s;position:relative}.cell:before{content:"";position:absolute;top:-8px;left:0;right:0;height:11px;background:repeating-linear-gradient(90deg,#a3a5a0 0 23%,transparent 23% 31%);opacity:.8}.cell:active{transform:translateY(3px);filter:brightness(1.2)}.cell.door{background:linear-gradient(90deg,#3b2b21,#98643c 25%,#70452b 52%,#a76b3e 78%,#3b2b21);border-color:#d3aa68;border-radius:5px 5px 30px 30px}.cell.door:before{background:repeating-linear-gradient(90deg,#cba86c 0 25%,transparent 25% 34%)}.cell.unknown{background:linear-gradient(140deg,#56616a,#2c3841);border-color:#82909a}.cell.broken{background:repeating-linear-gradient(140deg,#4b4640 0 14px,#292d2e 14px 27px);border-style:dashed;color:#edbd8b}.cell small{font-size:10px;line-height:1.15;text-align:center;text-shadow:0 1px 2px #000}.cell span{font-size:34px;filter:drop-shadow(0 2px 2px #0009)}button{font-family:inherit;border:1px solid #a48b62;background:linear-gradient(180deg,#47535b,#303b44);color:#fff0d5;padding:12px 15px;border-radius:10px;cursor:pointer;font-weight:700;box-shadow:0 3px 0 #15191e;transition:transform .12s,filter .12s}button:active{transform:translateY(2px)}button.active,button.primary{background:linear-gradient(180deg,#f0c77a,#b9823c);color:#242018;border-color:#ffe0a0}button:disabled{opacity:.4;cursor:not-allowed}.tool{flex:1 1 145px;text-align:left;min-height:61px;border-left:4px solid #8e7650}.tool.active{border-left-color:#fff2be}.log{max-height:180px;overflow:auto;font-size:13px;color:#d6c6ae}.log p{padding:8px 10px;border-left:2px solid #b88b50;background:#ffffff08;border-radius:3px}.hide{display:none}.status{color:#f3cc86;font-weight:700}.overlay{position:fixed;inset:0;background:radial-gradient(circle at center,#3e3428,#0b1119 75%);z-index:10;display:flex;align-items:center;justify-content:center;padding:25px}.overlay>div{max-width:450px;text-align:center;padding:30px;border:1px solid #b18a51;border-radius:16px;background:#222a32;box-shadow:0 15px 50px #000b}.overlay.hide{display:none}#phase{font-family:Cinzel,Georgia,serif;color:#f2c57c}#turn{background:#8c6636;color:#fff0cf;padding:8px 12px;border-radius:25px;font-size:12px}#instructions{border-left:5px solid #d3a15b;line-height:1.6}#hint{margin:22px 0 3px;font-size:11px}#controls p{color:#c9b89e;line-height:1.5}.hero{text-align:center;padding:18px 0 6px}.hero-mark{font-size:32px;letter-spacing:12px;filter:drop-shadow(0 3px 3px #000)}@media(max-width:560px){main{padding:9px}.panel{padding:13px;margin:11px 0}.grid{gap:2px;padding:10px 2px 13px}.cell{height:85px;border-width:1px;border-bottom-width:4px;gap:3px}.cell span{font-size:22px}.cell small{font-size:8px}button{padding:11px 9px;font-size:12px}.tool{flex:1 1 43%;min-height:60px}h2{font-size:1rem}.hero-mark{font-size:24px}}

/* V2 : plateau tactique zénithal */
.battlefield{margin:14px 0;border:2px solid #977749;border-radius:16px;overflow:hidden;background:#293629;box-shadow:0 12px 34px #0009}
.battlefield-heading{display:flex;justify-content:space-between;gap:10px;padding:13px 15px;background:#27251f;color:#f2d59a;font:700 11px Inter,sans-serif;letter-spacing:.12em}
.battlefield-heading span:last-child{opacity:.62;font-size:9px}
.landscape{position:relative;overflow:hidden;min-height:525px;background:radial-gradient(ellipse at 20% 25%,#8b9469 0%,transparent 44%),radial-gradient(ellipse at 85% 78%,#596b48 0%,transparent 40%),repeating-linear-gradient(35deg,#687b52 0 13px,#718258 13px 27px,#687950 27px 31px);isolation:isolate}
.landscape:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 70px,#283d2520 72px 75px);opacity:.7}
.mountain{position:absolute;width:170px;height:90px;background:#a4a68b;clip-path:polygon(0 100%,28% 30%,43% 65%,62% 0,100% 100%);opacity:.32}.mountain-one{top:20px;left:-40px}.mountain-two{right:-30px;top:85px;transform:scale(.7)}
.forest{position:absolute;font-size:35px;color:#304a2d;text-shadow:3px 4px #152b1988;letter-spacing:-8px}.forest-one{top:140px;left:-15px;transform:rotate(-24deg)}.forest-two{right:8px;bottom:140px}
.castle{position:relative;margin:44px auto 0;width:min(88%,720px);height:330px;background:repeating-linear-gradient(0deg,#9c9279 0 23px,#766f60 24px 26px);border:18px solid #59574d;outline:6px solid #c1b397;box-shadow:0 18px 0 #30352e99,0 26px 30px #151e1699,inset 0 0 45px #302c25a0}
.castle:before,.castle:after{content:"";position:absolute;top:-24px;bottom:-24px;width:13px;background:repeating-linear-gradient(0deg,#d0c3a7 0 26px,#766c5d 26px 31px)}.castle:before{left:-25px}.castle:after{right:-25px}
.keep{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:125px;height:112px;background:repeating-linear-gradient(90deg,#666158 0 18px,#777267 19px 21px);border:9px solid #c1b392;box-shadow:6px 8px 0 #272a2680;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#f7e5b7;font:800 10px Cinzel,serif;letter-spacing:.08em}.keep-roof{font-size:43px;color:#d9b66d}
.courtyard{position:absolute;left:0;right:0;top:155px;text-align:center;font:700 11px Inter,sans-serif;color:#3f3d32;letter-spacing:.15em}.yard-detail{font-size:28px;opacity:.6;margin-top:9px}
.tower{position:absolute;bottom:-36px;width:67px;height:67px;border:10px solid #b8ae93;background:#57564e;z-index:3;display:grid;place-items:center;color:#e7d2a5;font-size:23px;box-shadow:4px 7px 0 #222b2477}.tower-left{left:-42px}.tower-right{right:-42px}
.castle .grid{position:absolute;bottom:-21px;left:-6px;right:-6px;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2px;padding:0;background:none;border:0;border-radius:0;z-index:4}.castle .grid:after{display:none}
.castle .cell{height:67px;border:3px solid #c3b79b;border-bottom:7px solid #4d4940;border-radius:2px;background:repeating-linear-gradient(90deg,#9c9788 0 14px,#79786e 15px 17px);box-shadow:inset 0 2px #ffffff45,2px 3px 2px #0006;gap:0}.castle .cell:before{height:8px;top:-8px;background:repeating-linear-gradient(90deg,#c8bfa8 0 16%,transparent 16% 25%)}.castle .cell.door{background:repeating-linear-gradient(90deg,#795031 0 8px,#a67745 8px 12px);border-color:#e6c27e;border-radius:15px 15px 3px 3px}.castle .cell.broken{background:#453f36;border:2px dashed #c0a98c}.castle .cell.unknown{background:repeating-linear-gradient(90deg,#69766e 0 11px,#52635b 12px 14px)}.castle .cell span{font-size:19px;line-height:1}.castle .cell small{font-size:8px;line-height:1.1;color:#fff9df}
.siege-camp{position:relative;text-align:center;margin:57px auto 12px;color:#f4e4b9;text-shadow:1px 2px 3px #172319;font:800 11px Cinzel,serif;letter-spacing:.09em}.camp-tents{font-size:27px;margin-top:7px}.map-hint{padding:13px;text-align:center;margin:0;background:#292a23;color:#ead8b5;font-size:12px}
#controls .tool{background:linear-gradient(145deg,#d2b788,#b5915c);border:2px solid #6f5030;border-left:6px solid #7b4c2a;color:#28231b;box-shadow:0 4px 0 #503b28;min-height:68px}#controls .tool.active{background:linear-gradient(145deg,#ffdc8c,#d9a64c);border-color:#f5dca6;box-shadow:0 0 0 2px #d6a45166,0 4px 0 #503b28}
@media(max-width:560px){.landscape{min-height:395px}.castle{height:235px;margin-top:42px;width:86%;border-width:11px;outline-width:4px}.castle:before,.castle:after{width:8px;top:-16px;bottom:-16px}.castle:before{left:-17px}.castle:after{right:-17px}.keep{top:12px;width:90px;height:75px;border-width:6px;font-size:8px}.keep-roof{font-size:26px}.courtyard{top:110px;font-size:8px}.yard-detail{font-size:20px}.tower{width:43px;height:43px;border-width:6px;bottom:-23px}.tower-left{left:-26px}.tower-right{right:-26px}.castle .grid{bottom:-14px;left:-5px;right:-5px;gap:1px}.castle .cell{height:52px;border-width:1px;border-bottom-width:5px;padding:0}.castle .cell span{font-size:16px}.castle .cell small{font-size:7px}.siege-camp{margin-top:49px;font-size:9px}.battlefield-heading{font-size:9px}.battlefield-heading span:last-child{font-size:8px}}
</style></head><body><main><header class="hero"><div class="hero-mark">⚔️ 🏰 ⚔️</div><h1>DERNIER REMPART</h1><p class="sub">Deux armées · Une forteresse · Douze tours</p></header><div class="panel row between"><strong id="phase"></strong><strong id="turn"></strong></div><section class="panel" id="instructions"></section><section class="battlefield"><div class="battlefield-heading"><span>⚑ LE CHAMP DE BATAILLE</span><span>VUE TACTIQUE · ZÉNITHALE</span></div><div class="landscape"><div class="mountain mountain-one"></div><div class="mountain mountain-two"></div><div class="forest forest-one">♣ ♣ ♣</div><div class="forest forest-two">♣ ♣</div><div class="castle"><div class="keep"><div class="keep-roof">✦</div><span>DONJON</span></div><div class="courtyard"><span>COUR INTÉRIEURE</span><div class="yard-detail">⚔</div></div><div class="tower tower-left">✣</div><div class="tower tower-right">✣</div><div class="grid" id="wall"></div></div><div class="siege-camp"><span>⚑ CAMP DES ASSIÉGEANTS ⚑</span><div class="camp-tents">⛺　⚔　⛺</div></div></div><p class="map-hint" id="hint"></p></section><section class="panel" id="controls"></section><section class="panel"><h2>Chronique du siège</h2><div id="log" class="log"></div></section><button onclick="reset()">↻ Nouvelle partie</button></main><div id="handoff" class="overlay hide"><div><h1>🛡 Changement de joueur</h1><p id="handoffText"></p><button class="primary" onclick="resume()">Je suis prêt</button></div></div>
<script>
const N=9;let state,mode,choice,turn,ram,sappers,breach,ladders,spies,units,points,guards,logs,overlayNext;
function reset(){state=Array.from({length:N},()=>({type:'wall',hp:2,revealed:false,broken:false,guard:false}));mode='build';choice='door';turn=1;ram=1;sappers=2;breach=1;ladders=3;spies=2;units=3;points=4;guards=3;logs=['Le défenseur prépare sa forteresse.'];document.getElementById('handoff').classList.add('hide');render()}
const doors=()=>state.filter(x=>x.type==='door').length;
function note(s){logs.unshift(s)}
function build(i){let c=state[i];if(choice==='door'){if(c.type!=='door'&&doors()>=3)return noteAndRender('Maximum trois portes.');c.type='door';c.hp=2;c.guard=false}else if(choice==='wall'){c.type='wall';c.hp=2;c.guard=false}else if(choice==='reinforce'){if(points<1||c.hp>=4)return;points--;c.hp++}else if(choice==='guard'){if(points<1||c.guard)return;points--;c.guard=true}render()}
function noteAndRender(s){note(s);render()}
function pass(next,msg){overlayNext=next;document.getElementById('handoffText').textContent=msg;document.getElementById('handoff').classList.remove('hide')}
function resume(){mode=overlayNext;document.getElementById('handoff').classList.add('hide');render()}
function damage(c,n){c.revealed=true;c.hp=Math.max(0,c.hp-n);if(c.hp===0)c.broken=true}
function attack(i){if(mode!=='attack')return;let c=state[i],msg='',win=false,valid=true;
if(choice==='catapult'){if(c.broken)return noteAndRender('Cette section est déjà détruite.');if(!c.revealed&&c.type==='wall'){c.revealed=true;msg='La catapulte révèle le mur '+(i+1)+' ('+c.hp+' résistance).'}else{damage(c,1);msg='Impact sur la section '+(i+1)+(c.broken?' : détruite !':' : '+c.hp+' résistance restante.')}}
else if(choice==='ram'){if(!ram)return;ram=0;if(c.type==='door'){damage(c,3);msg='Le bélier frappe la porte '+(i+1)+(c.broken?' : détruite !':' : elle résiste !')}else{c.revealed=true;msg='Le bélier se brise contre un mur !'}}
else if(choice==='sappers'){if(!sappers)return;sappers--;damage(c,99);msg='Les sapeurs détruisent la section '+(i+1)+' !'}
else if(choice==='breach'){if(!breach)return;breach=0;let j=i===8?7:i+1;damage(c,99);damage(state[j],99);msg='Grande brèche : sections '+(i+1)+' et '+(j+1)+' détruites !'}
else if(choice==='ladder'||choice==='spy'||choice==='charge'){if(!units)return;let possible=choice==='ladder'?c.type==='wall'&&!c.broken:choice==='spy'?(c.type==='door'||c.broken):c.broken;if(choice==='ladder'){if(!ladders)return;ladders--}if(choice==='spy'){if(!spies)return;spies--}c.revealed=true;if(!possible){msg='La manœuvre échoue : passage inadapté.'}else if(c.guard){c.guard=false;units--;msg='Une garnison repousse les assaillants ! Une unité perdue.'}else{win=true;msg='Les assaillants pénètrent dans la forteresse !'}}
else valid=false;
if(!valid)return;note('Tour '+turn+' — '+msg);if(win){mode='endAttack'}else if(units<=0||turn>=12){mode='endDefense'}else{mode='defend';pass('defend','Défenseur : reprends le téléphone pour consulter le résultat du tour '+turn+'.')}render()}
function repair(i){let c=state[i];if(mode!=='defend'||guards<1||!c.broken)return;guards--;c.broken=false;c.hp=1;c.revealed=true;note('Le défenseur colmate la brèche '+(i+1)+'.');render()}
function endDefense(){turn++;pass('attack','Attaquant : reprends le téléphone. Tour '+turn+'.')}
function render(){document.getElementById('phase').textContent={build:'Construction secrète',attack:'Assaut',defend:'Réaction du défenseur',endAttack:'Victoire de l’attaquant',endDefense:'Victoire du défenseur'}[mode];document.getElementById('turn').textContent='Tour '+Math.min(turn,12)+'/12';
document.getElementById('wall').innerHTML=state.map((c,i)=>{let visible=mode==='build'||c.type==='door'||c.revealed||c.broken;return '<button aria-label="Section '+(i+1)+'" class="cell '+(c.broken?'broken':c.type==='door'?'door':visible?'':'unknown')+'" onclick="cell('+i+')"><span>'+(c.broken?'✕':!visible?'◆':c.type==='door'?'▥':'▦')+'</span><small>'+(c.broken?'BRÈCHE':visible?c.hp+' PV':'?')+'</small>'+(mode==='build'&&c.guard?'<small>⚔</small>':'')+'<small>'+(i+1)+'</small></button>'}).join('');
let info='',ctrl='';
if(mode==='build'){info='Le défenseur place 1 à 3 portes visibles. Les autres sections sont des murs secrets. Il peut répartir 4 points de fortification.';ctrl='<h2>🛡 Atelier de fortification · Portes '+doors()+'/3 · Points '+points+'</h2>'+buttons([['door','🚪 Porte'],['wall','▦ Mur'],['reinforce','⬆ Renforcer +1 PV'],['guard','⚔ Garnison']])+'<p>Une garnison bloque une tentative de franchissement. Une porte et un mur ont 2 PV de base.</p><button class="primary" '+(doors()<1?'disabled':'')+' onclick="pass(\'attack\',\'Défenseur : passe le téléphone à l’attaquant. Ne lui montre pas ton plan secret.\')">Terminer la forteresse →</button>'}
if(mode==='attack'){info='Choisis ton arme, puis touche une section. Les portes sont visibles, les murs encore intacts peuvent être secrets. Pour gagner, il faut franchir une porte, une brèche ou un mur par échelle.';ctrl='<h2>🃏 Cartes de siège · '+units+' unités d’assaut</h2>'+buttons([['catapult','🪨 Catapulte · ∞'],['ram','🪵 Bélier · '+ram],['sappers','⛏ Sapeurs · '+sappers],['breach','💥 Grande brèche · '+breach],['ladder','🪜 Échelle · '+ladders],['spy','🕵 Infiltration · '+spies],['charge','⚔ Assaut par brèche']])}
if(mode==='defend'){info='Le défenseur peut colmater une brèche en touchant sa section (1 point de réparation), ou conserver ses ressources et passer son tour.';ctrl='<h2>🔨 Réserves de réparation : '+guards+'</h2><button class="primary" onclick="endDefense()">Terminer la défense →</button>'}
if(mode==='endAttack'||mode==='endDefense'){info=mode==='endAttack'?'🏆 La forteresse est prise !':'🏆 La forteresse a résisté !';ctrl='<button class="primary" onclick="reset()">Rejouer</button>'}
document.getElementById('instructions').textContent=info;document.getElementById('controls').innerHTML=ctrl;document.getElementById('hint').textContent=mode==='build'?'🛡 Plan secret du défenseur · Touchez les sections du rempart sud':mode==='defend'?'🔨 Touchez une brèche pour la réparer':'⚔ Choisissez une carte puis touchez une section du rempart';document.getElementById('log').innerHTML=logs.map(s=>'<p>'+s+'</p>').join('')}
function buttons(arr){return '<div class="row">'+arr.map(([v,label])=>'<button class="tool '+(choice===v?'active':'')+'" onclick="choice=\''+v+'\';render()">'+label+'</button>').join('')+'</div>'}
function cell(i){if(mode==='build')build(i);else if(mode==='attack')attack(i);else if(mode==='defend')repair(i)}
reset();
</script></body></html>
